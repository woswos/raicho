name: raicho-tools

x-tools: &tools
  image: raicho-tools:local
  build:
    context: ..
    dockerfile: containers/tooling/Dockerfile
  working_dir: /workspace
  user: '${LOCAL_UID:-1000}:${LOCAL_GID:-1000}'
  read_only: true
  tmpfs:
    - /tmp:exec,mode=1777
  environment:
    PR_DESCRIPTION: ${PR_DESCRIPTION:-}
    PR_LABELS: ${PR_LABELS:-}
    PR_BASE_SHA: ${PR_BASE_SHA:-}
    PR_HEAD_SHA: ${PR_HEAD_SHA:-}
    GIT_CONFIG_COUNT: '1'
    GIT_CONFIG_KEY_0: safe.directory
    GIT_CONFIG_VALUE_0: /workspace
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true

services:
  check:
    <<: *tools
    volumes:
      - ..:/workspace:ro
  format:
    <<: *tools
    volumes:
      - ..:/workspace:rw
    command: [make, format]
