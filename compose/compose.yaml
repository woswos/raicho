name: raicho

services:
  raicho:
    image: raicho-server:local
    platform: linux/amd64
    build:
      context: ..
      dockerfile: containers/raicho/Dockerfile
      args:
        RAICHO_COMMIT: ${RAICHO_COMMIT:-unknown}
    read_only: true
    tmpfs:
      - /tmp:mode=1777
    volumes:
      - raicho-data:/var/lib/raicho
    networks: [application, connector-application]
    ports:
      - '127.0.0.1:${RAICHO_PORT:-8080}:8080'
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s
    restart: unless-stopped

  gateway:
    image: raicho-gateway:local
    platform: linux/amd64
    build:
      context: ..
      dockerfile: containers/gateway/Dockerfile
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    networks: [connector-application, connector-thunderbird]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    stop_grace_period: 10s
    restart: unless-stopped

  thunderbird:
    image: raicho-thunderbird:local
    platform: linux/amd64
    build:
      context: ..
      dockerfile: containers/thunderbird/Dockerfile
    read_only: true
    tmpfs:
      - /tmp:mode=1777
    volumes:
      - thunderbird-data:/config
    networks: [thunderbird, connector-thunderbird]
    shm_size: 1gb
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s
    restart: unless-stopped

networks:
  application:
  thunderbird:
  connector-application:
    internal: true
  connector-thunderbird:
    internal: true

volumes:
  raicho-data:
  thunderbird-data:
