services:
  thunderbird:
    environment:
      RAICHO_CONNECTOR_ENDPOINT: ws://gateway:8081/connector/v1
      RAICHO_CONNECTOR_TOKEN_FILE: /run/secrets/raicho_connector_token
    secrets:
      - raicho_connector_token

  provisioner:
    image: raicho-server:local
    platform: linux/amd64
    profiles: [provisioning]
    user: '10001:10001'
    network_mode: none
    read_only: true
    tmpfs:
      - /tmp:mode=1777
    volumes:
      - raicho-data:/var/lib/raicho
      - type: bind
        source: ${RAICHO_CREDENTIAL_DIRECTORY:?Use runtime/credentials/raicho_connector.bash}
        target: /credentials
        read_only: true
        bind:
          create_host_path: false
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      disable: true

  credential_check:
    image: raicho-tools:local
    platform: linux/amd64
    profiles: [provisioning]
    user: '10001:10001'
    entrypoint: [python3, -B, /helper/raicho_wait_connector.py]
    networks: [application]
    read_only: true
    tmpfs:
      - /tmp:mode=1777
    volumes:
      - ../runtime/credentials/raicho_wait_connector.py:/helper/raicho_wait_connector.py:ro
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]

  credential_files:
    image: raicho-tools:local
    platform: linux/amd64
    profiles: [provisioning]
    user: '0:0'
    entrypoint: [python3, -B, /helper/raicho_connector_files.py]
    network_mode: none
    read_only: true
    volumes:
      - ../runtime/credentials/raicho_connector_files.py:/helper/raicho_connector_files.py:ro
      - type: bind
        source: ${RAICHO_CREDENTIAL_DIRECTORY:?Use runtime/credentials/raicho_connector.bash}
        target: /credentials
        bind:
          create_host_path: false
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER]
    security_opt: [no-new-privileges:true]

secrets:
  raicho_connector_token:
    file: ${RAICHO_CREDENTIAL_DIRECTORY:?Use runtime/credentials/raicho_connector.bash}/connector.token
