services:
  raicho:
    ports: !reset []
    restart: 'no'
  thunderbird:
    restart: 'no'
  gateway:
    restart: 'no'
  smoke:
    image: raicho-tools:local
    build:
      context: ..
      dockerfile: containers/tooling/Dockerfile
    profiles: [test]
    networks: [application]
    working_dir: /workspace
    entrypoint: [python3, -B, devbin/raicho_runtime_checks.py]
    user: '10001:10001'
    read_only: true
    tmpfs:
      - /tmp:mode=1777
    volumes:
      - ..:/workspace:ro
      - raicho-data:/fixture/raicho
      - thunderbird-data:/fixture/thunderbird
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
