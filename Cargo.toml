[workspace]
members = ["server", "protocol/rust", "protocol/generator"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99.1"
license = "MIT"

[workspace.dependencies]
axum = { version = "=0.8.9", default-features = false, features = ["http1", "json", "tokio"] }
futures-util = { version = "=0.3.34", features = ["sink"] }
getrandom = "=0.4.3"
hmac = "=0.13.0"
jsonschema = { version = "=0.59.0", default-features = false }
libc = "=0.2.191"
libsqlite3-sys = { version = "=0.37.0", default-features = false }
prettyplease = "=0.3.0"
regress = "=0.12.0"
rustix = { version = "=1.1.5", features = ["fs"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.154", features = ["float_roundtrip"] }
sha2 = "=0.11.1"
sqlx = { version = "=0.9.0", default-features = false, features = ["runtime-tokio", "sqlite-bundled", "migrate", "macros"] }
subtle = "=2.6.1"
syn = { version = "=3.0.9", features = ["full", "visit-mut"] }
tempfile = "=3.27.0"
tokio = { version = "=1.53.3", features = ["macros", "rt-multi-thread", "signal", "net", "time", "sync"] }
tokio-tungstenite = { version = "=0.29.0", default-features = false, features = ["connect", "handshake"] }
tower = { version = "=0.5.3", features = ["util"] }
tower-http = { version = "=0.7.1", features = ["fs", "set-header"] }
typify = { version = "=0.8.0", default-features = false }
