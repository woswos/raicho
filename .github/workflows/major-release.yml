name: Major release

# A major release is never automatic. The person who runs this workflow has
# to type MAJOR.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type MAJOR to confirm a major version bump.
        required: true
        default: ''

concurrency:
  group: cut-release
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: read

jobs:
  cut:
    name: Cut a major release
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    if: ${{ github.ref == 'refs/heads/main' }}

    steps:
      - name: Check the confirmation and the token
        env:
          CONFIRM: ${{ inputs.confirm }}
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          if [ "${CONFIRM}" != "MAJOR" ]; then
            echo "::error::Type MAJOR to confirm. Nothing was released."
            exit 1
          fi
          if [ -z "${RELEASE_TOKEN}" ]; then
            echo "::error::No RELEASE_TOKEN is set, so nothing can be pushed. Nothing was released."
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN }}

      - name: Work out the version and date the changelog
        id: cut
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 -B devbin/raicho_cut_release.py --write --major

      - name: Refuse a release with nothing in it
        if: steps.cut.outputs.released != 'true'
        run: |
          echo "::error::There is nothing under Unreleased to release."
          exit 1

      - name: Check the notes read back
        run: python3 -B devbin/raicho_release_notes.py "${{ steps.cut.outputs.version }}" >/dev/null

      - name: Commit and tag
        run: |
          git config user.name "raicho-release"
          git config user.email "raicho-release@users.noreply.github.com"
          git add CHANGELOG.md Cargo.toml Cargo.lock
          if [ -d extension ]; then
            git add --update -- extension
          fi
          git commit -m "chore(release): ${{ steps.cut.outputs.tag }}"
          git tag -a "${{ steps.cut.outputs.tag }}" -m "${{ steps.cut.outputs.tag }}"
          git push origin HEAD:main
          git push origin "${{ steps.cut.outputs.tag }}"

      - name: Say what happened
        run: echo "Released ${{ steps.cut.outputs.tag }}." >> "$GITHUB_STEP_SUMMARY"
