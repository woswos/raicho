name: Auto release

# A push to main that leaves a changelog entry becomes a release. The tag
# pushed here is what starts release.yml. The workflow stays idle until
# RELEASE_TOKEN can push to main and push tags. The default token cannot
# start that later workflow.

on:
  push:
    branches: [main]

concurrency:
  group: cut-release
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: read

jobs:
  cut:
    name: Cut a release if there is one
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    if: ${{ !startsWith(github.event.head_commit.message, 'chore(release):') }}

    steps:
      - name: Look for the release token
        id: token
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          if [ -z "${RELEASE_TOKEN}" ]; then
            echo "have=false" >> "$GITHUB_OUTPUT"
          else
            echo "have=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.token.outputs.have == 'true'
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN }}

      - name: Work out the version and date the changelog
        id: cut
        if: steps.token.outputs.have == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 -B devbin/raicho_cut_release.py --write

      - name: Check the notes read back
        if: steps.cut.outputs.released == 'true'
        run: python3 -B devbin/raicho_release_notes.py "${{ steps.cut.outputs.version }}" >/dev/null

      - name: Commit and tag
        if: steps.cut.outputs.released == 'true'
        run: |
          git config user.name "raicho-release"
          git config user.email "raicho-release@users.noreply.github.com"
          git add CHANGELOG.md Cargo.toml
          if [ -d extension ]; then
            git add --update -- extension
          fi
          git commit -m "chore(release): ${{ steps.cut.outputs.tag }}"
          git tag -a "${{ steps.cut.outputs.tag }}" -m "${{ steps.cut.outputs.tag }}"
          git push origin HEAD:main
          git push origin "${{ steps.cut.outputs.tag }}"

      - name: Say what happened
        run: |
          if [ "${{ steps.token.outputs.have }}" != "true" ]; then
            echo "No RELEASE_TOKEN is set, so nothing was released." >> "$GITHUB_STEP_SUMMARY"
          elif [ "${{ steps.cut.outputs.released }}" = "true" ]; then
            echo "Released ${{ steps.cut.outputs.tag }}." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Nothing under Unreleased needed a release." >> "$GITHUB_STEP_SUMMARY"
          fi
