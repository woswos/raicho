name: Repository checks

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, edited, labeled, unlabeled, ready_for_review]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/raicho-cache
          key: rust-${{ github.job }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: rust-${{ github.job }}-
      - name: Check repository and languages
        env:
          RAICHO_CACHE_DIRECTORY: ${{ runner.temp }}/raicho-cache
        run: make lint test-python test-tooling

  pr-guards:
    if: github.event_name == 'pull_request'
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check pull request policy
        run: make lint-pr

  application-build:
    if: >-
      !contains(github.event.pull_request.labels.*.name, 'design') &&
      !contains(github.event.pull_request.labels.*.name, 'skip-build')
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 45
    env:
      RAICHO_COMMIT: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate runtime configuration
        env:
          RAICHO_CREDENTIAL_DIRECTORY: /tmp/raicho-ci-credentials
          RAICHO_TEST_TOOLING_IMAGE: raicho-tools:local
          RAICHO_MAIL_TEST_IMAGE: raicho-thunderbird:local
        run: |
          docker compose -f compose.yaml config --quiet
          docker compose -f compose.yaml -f compose.admin.yaml config --quiet
          docker compose -f compose.yaml -f automation/acceptance/runtime/compose.test.yaml config --quiet
          docker compose -f compose.yaml -f automation/acceptance/runtime/compose.test.yaml -f compose.admin.yaml config --quiet
          docker compose -f compose.yaml -f compose.credentials.yaml config --quiet
          docker compose -f compose.yaml -f automation/acceptance/runtime/compose.test.yaml -f compose.admin.yaml -f compose.credentials.yaml config --quiet
          docker compose -f compose.yaml -f compose.credentials.yaml -f automation/acceptance/runtime/compose.test.yaml -f automation/acceptance/connector/compose.upgrade.yaml --profile test config --quiet
          docker compose -f mailprobe/compose.yaml --profile test config --quiet
          docker compose -f mailprobe/compose.yaml -f mailprobe/compose.admin.yaml --profile test config --quiet
      - name: Build application images
        run: make images

  application-test:
    if: >-
      !contains(github.event.pull_request.labels.*.name, 'design') &&
      !contains(github.event.pull_request.labels.*.name, 'skip-test')
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/raicho-cache
          key: rust-${{ github.job }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: rust-${{ github.job }}-
      - name: Build and test application sources
        env:
          RAICHO_CACHE_DIRECTORY: ${{ runner.temp }}/raicho-cache
        run: make test

  coverage:
    if: >-
      !contains(github.event.pull_request.labels.*.name, 'design') &&
      !contains(github.event.pull_request.labels.*.name, 'skip-test') &&
      !contains(github.event.pull_request.labels.*.name, 'skip-coverage-check')
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/raicho-cache
          key: rust-${{ github.job }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: rust-${{ github.job }}-
      - name: Check patch coverage
        if: github.event_name == 'pull_request'
        env:
          RAICHO_CACHE_DIRECTORY: ${{ runner.temp }}/raicho-cache
        run: make check-patch-coverage
      # Pull requests can restore caches saved on main, but not each other's. An exact key hit saves nothing.
      - name: Save the coverage build for pull requests
        if: github.event_name == 'push' && steps.cargo.outputs.cache-hit != 'true'
        env:
          RAICHO_CACHE_DIRECTORY: ${{ runner.temp }}/raicho-cache
        run: make coverage

  runtime-test:
    if: >-
      !contains(github.event.pull_request.labels.*.name, 'design') &&
      !contains(github.event.pull_request.labels.*.name, 'skip-test')
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 45
    env:
      COMPOSE_PROJECT_NAME: raicho-ci-${{ github.run_id }}-${{ github.run_attempt }}
      RAICHO_COMMIT: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify startup, persistence, isolation, and independent readiness
        run: make acceptance-runtime

  connector-test:
    if: >-
      !contains(github.event.pull_request.labels.*.name, 'design') &&
      !contains(github.event.pull_request.labels.*.name, 'skip-test')
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify production connector and ten-minute idle acceptance
        env:
          TMPDIR: ${{ runner.temp }}
        run: make acceptance-connector
      - name: Verify credential rotation, recovery, and revocation
        env:
          TMPDIR: ${{ runner.temp }}
        run: make acceptance-credentials

  compatibility-test:
    if: >-
      !contains(github.event.pull_request.labels.*.name, 'design') &&
      !contains(github.event.pull_request.labels.*.name, 'skip-test')
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify unattended mail API compatibility
        run: make acceptance-mail
