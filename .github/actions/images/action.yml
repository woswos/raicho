name: Images
description: Build images through the GitHub Actions layer cache, so later builds in the job reuse their layers.
inputs:
  images:
    description: Space-separated names accepted by automation/tooling/cache_images.bash.
    required: true
  write:
    description: Whether this job updates the cached layers.
    default: 'false'
runs:
  using: composite
  steps:
    - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      with:
        driver-opts: default-load=true
    # BuildKit reads the cache service from these variables, which only JavaScript actions receive.
    - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      with:
        script: |
          for (const name of ['ACTIONS_CACHE_SERVICE_V2', 'ACTIONS_CACHE_URL', 'ACTIONS_RESULTS_URL', 'ACTIONS_RUNTIME_TOKEN']) {
            if (process.env[name]) {
              core.setSecret(process.env[name]);
              core.exportVariable(name, process.env[name]);
            }
          }
    - shell: bash
      env:
        IMAGES: ${{ inputs.images }}
        RAICHO_IMAGE_CACHE_WRITE: ${{ inputs.write == 'true' && '1' || '' }}
      run: bash automation/tooling/cache_images.bash ${IMAGES}
