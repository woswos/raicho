services:
  login:
    image: raicho-server:local
    platform: linux/amd64
    profiles: [login]
    entrypoint: [/usr/local/bin/raicho-server, login]
    user: '10001:10001'
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    network_mode: none
    tmpfs:
      - /tmp:mode=1777
    volumes:
      - raicho-data:/var/lib/raicho
    healthcheck:
      disable: true
