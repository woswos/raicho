name: raicho

x-hardened-service: &hardened-service
  platform: linux/amd64
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  restart: unless-stopped

services:
  raicho:
    <<: *hardened-service
    image: raicho-server:local
    build:
      context: .
      dockerfile: deploy/raicho/Dockerfile
      args:
        RAICHO_COMMIT: ${RAICHO_COMMIT:-unknown}
    tmpfs:
      - /tmp:mode=1777
    volumes:
      - raicho-data:/var/lib/raicho
    networks: [application, connector-application]
    ports:
      - '127.0.0.1:${RAICHO_PORT:-8080}:8080'
    stop_grace_period: 30s

  gateway:
    <<: *hardened-service
    image: raicho-gateway:local
    build:
      context: .
      dockerfile: deploy/gateway/Dockerfile
    tmpfs:
      - /tmp:size=16m,mode=1777
    networks: [connector-application, connector-thunderbird]
    stop_grace_period: 10s

  thunderbird:
    <<: *hardened-service
    image: raicho-thunderbird:local
    build:
      context: .
      dockerfile: deploy/thunderbird/Dockerfile
    tmpfs:
      - /tmp:mode=1777
    volumes:
      - thunderbird-data:/config
    networks: [thunderbird, connector-thunderbird]
    shm_size: 1gb
    stop_grace_period: 30s

networks:
  application:
  thunderbird:
  connector-application:
    internal: true
  connector-thunderbird:
    internal: true

volumes:
  raicho-data:
  thunderbird-data:
