services:
  raicho:
    image: raicho-server:local
    platform: linux/amd64
    build:
      context: .
      dockerfile: containers/raicho/Dockerfile
    read_only: true
    tmpfs:
      - /tmp:mode=1777
    volumes:
      - raicho-data:/var/lib/raicho
    ports:
      - '127.0.0.1:${RAICHO_PORT:-8080}:8080'
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s
    restart: unless-stopped

  thunderbird:
    image: raicho-thunderbird:local
    platform: linux/amd64
    build:
      context: containers/thunderbird
    read_only: true
    tmpfs:
      - /tmp:mode=1777
    volumes:
      - thunderbird-data:/config
    shm_size: 1gb
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s
    restart: unless-stopped

volumes:
  raicho-data:
  thunderbird-data:
