worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/null;

events {
    worker_connections 64;
}

http {
    access_log off;
    server_tokens off;
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    resolver 127.0.0.11 valid=2s ipv6=off;
    resolver_timeout 2s;

    map $request $connector_request {
        default 0;
        "GET /connector/v1 HTTP/1.1" 1;
    }

    upstream connector {
        zone connector 64k;
        server raicho:8082 resolve;
    }

    server {
        listen 8081;
        client_max_body_size 1k;
        client_header_timeout 5s;
        client_body_timeout 5s;
        keepalive_timeout 5s;
        send_timeout 5s;

        location = /connector/v1 {
            if ($connector_request = 0) { return 404; }
            if ($http_upgrade != "websocket") { return 400; }
            proxy_pass http://connector;
            proxy_http_version 1.1;
            proxy_set_header Host raicho;
            proxy_set_header Upgrade websocket;
            proxy_set_header Connection upgrade;
            proxy_set_header Authorization "";
            proxy_set_header Cookie "";
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_cache off;
            proxy_connect_timeout 2s;
            proxy_read_timeout 60s;
            proxy_send_timeout 5s;
        }

        location / { return 404; }
    }
}
