[tool.ruff]
required-version = "==0.16.8"
target-version = "py313"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "single"

[tool.diff_cover]
fail_under = 90

# coverage.py runs in the tooling image, which mounts the checkout at /workspace.
[tool.coverage.run]
data_file = "/tmp/raicho-coverage/python/data"
parallel = true
concurrency = ["thread", "multiprocessing"]
patch = ["subprocess"]
include = ["/workspace/*", "/tmp/*/automation/*"]
omit = ["*/tests/*", "*_tests.py", "*_checks.py", "*/automation/acceptance/*", "*/mailprobe/*"]

# Guard tests run copies of automation/ from temporary repositories.
[tool.coverage.paths]
automation = ["/workspace/automation/", "/tmp/*/automation/"]
